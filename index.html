<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Face Masks</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000; overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
  }
  #stage {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%); line-height: 0;
  }
  video { display: none; }
  canvas { display: block; background: #000; max-width: 100vw; max-height: 100vh; }

  #chars {
    position: fixed;
    bottom: 16px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 8px;
    padding: 8px 10px;
    background: rgba(20,20,30,0.85);
    border: 1px solid rgba(255,215,0,0.25);
    border-radius: 40px;
    backdrop-filter: blur(8px);
    z-index: 10;
    box-shadow: 0 4px 30px rgba(0,0,0,0.6);
  }
  .char-btn {
    width: 56px; height: 56px;
    border-radius: 50%;
    border: 2px solid transparent;
    background: #111;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    transition: all 0.18s ease;
    color: #fff;
    overflow: hidden;
    position: relative;
  }
  .char-btn:hover { transform: scale(1.1); border-color: rgba(255,215,0,0.5); }
  .char-btn.active {
    border-color: #ffd700;
    box-shadow: 0 0 20px rgba(255,215,0,0.6);
    transform: scale(1.08);
  }
  .char-btn .label {
    position: absolute; bottom: -22px; left: 50%;
    transform: translateX(-50%);
    font-size: 10px; color: #ffd700;
    white-space: nowrap;
    opacity: 0; transition: opacity 0.2s;
    pointer-events: none;
  }
  .char-btn.active .label,
  .char-btn:hover .label { opacity: 1; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas" width="640" height="480"></canvas>
</div>

<div id="chars">
  <button class="char-btn active" data-char="pineapple" title="Ананас">🍍<span class="label">Ананас</span></button>
  <button class="char-btn" data-char="watermelon" title="Арбуз">🍉<span class="label">Арбуз</span></button>
  <button class="char-btn" data-char="abobus" title="Абобус">🚌<span class="label">Абобус</span></button>
  <button class="char-btn" data-char="guy" title="Мужик">🧔<span class="label">Мужик</span></button>
  <button class="char-btn" data-char="morty" title="Злой Морти">😠<span class="label">Морти</span></button>
</div>

<script type="module">
import { FaceLandmarker, HandLandmarker, FilesetResolver } from
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video  = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');

const CFG = {
  smooth:     0.55,
  zoom:       1.45,
};

const LM = {
  leftEyeOuter: 33,  leftEyeInner: 133,
  rightEyeInner: 362, rightEyeOuter: 263,
  leftEyeTop: 159, leftEyeBot: 145,
  rightEyeTop: 386, rightEyeBot: 374,
  mouthLeft: 61,  mouthRight: 291,
  mouthTop: 13,   mouthBottom: 14,
  upperLipTop: 0,   upperLipBot: 12,
  lowerLipTop: 17,  lowerLipBot: 15,
  chin: 152, forehead: 10,
  leftCheek: 234, rightCheek: 454,
  noseTip: 1,
  leftBrowInner: 107, leftBrowMid: 105, leftBrowOuter: 70,
  rightBrowInner: 336, rightBrowMid: 334, rightBrowOuter: 300,
  hairL: 9, hairM: 151, hairR: 8,
};

let faceLandmarker = null;
let handLandmarker = null;
let lastVideoTime = -1;
let smooth = null;
let handSmooth = {};
let startTime = performance.now();
let currentChar = 'pineapple';

// =================== ПЕРСОНАЖИ ===================
const CHARACTERS = {
  pineapple: {
    bodyW: 1.55, bodyH: 1.15,
    bodyColor: '#F5C542', bodyDark: '#B8860B', bodyLight: '#FFE97A',
    leaf: ['#1B5E1B','#2E8B2E','#4CAF4C','#66BB66'],
    browColor: '#6B4A00',
  },
  watermelon: {
    bodyW: 1.55, bodyH: 1.05,
    bodyColor: '#2E8B2E', bodyDark: '#1B5E1B', bodyLight: '#66BB66',
    leaf: ['#1B5E1B','#2E8B2E','#4CAF4C','#66BB66'],
    browColor: '#2B3B0B',
  },
  abobus: {
    bodyW: 1.5, bodyH: 1.0,
    bodyColor: '#E0E0E0', bodyDark: '#9E9E9E', bodyLight: '#FFFFFF',
    leaf: ['#1565C0','#1E88E5','#42A5F5','#64B5F6'],
    browColor: '#0D47A1',
  },
  guy: {
    bodyW: 1.4, bodyH: 1.2,
    bodyColor: '#FFCC99', bodyDark: '#D4A373', bodyLight: '#FFE4C4',
    leaf: ['#3E2723','#5D4037','#6D4C41','#8D6E63'],
    browColor: '#3E2723',
  },
  morty: {
    bodyW: 1.45, bodyH: 1.1,
    bodyColor: '#F5DEB3', bodyDark: '#C9A227', bodyLight: '#FFF8DC',
    leaf: ['#C6A700','#E6C200','#F5DEB3','#FFF8DC'],
    browColor: '#8B0000',
  }
};

// =================== КНОПКИ ПЕРСОНАЖЕЙ ===================
document.querySelectorAll('.char-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.char-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentChar = btn.dataset.char;
  });

async function init() {
  const fileset = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  faceLandmarker = await FaceLandmarker.createFromOptions(fileset, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numFaces: 1,
  });
  handLandmarker = await HandLandmarker.createFromOptions(fileset, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numHands: 2,
  });
  await startCamera();
  requestAnimationFrame(loop);
}

async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' },
    audio: false
  });
  video.srcObject = stream;
  await new Promise(r => video.onloadedmetadata = r);
  await video.play();
  canvas.width  = video.videoWidth  || 640;
  canvas.height = video.videoHeight || 480;
}

function lerp(a, b, t) { return a + (b - a) * t; }

function toScene(px, py, pz, W, H) {
  return { x: (1 - px) * W, y: py * H, z: pz || 0 };
}
function zoomPoint(p, W, H) {
  const z = CFG.zoom;
  return {
    x: (p.x - W/2) * z + W/2,
    y: (p.y - H/2) * z + H/2,
    z: p.z
  };
}
function lmToScene(lm, W, H) {
  return zoomPoint(toScene(lm.x, lm.y, lm.z, W, H), W, H);
}

function computeFace(landmarks, W, H) {
  const p = (i) => lmToScene(landmarks[i], W, H);

  const lEyeOut = p(LM.leftEyeOuter),  lEyeIn = p(LM.leftEyeInner);
  const rEyeIn  = p(LM.rightEyeInner), rEyeOut = p(LM.rightEyeOuter);
  const lEyeTop = p(LM.leftEyeTop),  lEyeBot = p(LM.leftEyeBot);
  const rEyeTop = p(LM.rightEyeTop), rEyeBot = p(LM.rightEyeBot);
  const mLeft   = p(LM.mouthLeft),   mRight  = p(LM.mouthRight);
  const mTop    = p(LM.mouthTop),    mBot    = p(LM.mouthBottom);
  const chin    = p(LM.chin),        fore    = p(LM.forehead);
  const cheekL  = p(LM.leftCheek),   cheekR  = p(LM.rightCheek);
  const nose    = p(LM.noseTip);

  const lBrowIn  = p(LM.leftBrowInner),  lBrowMid = p(LM.leftBrowMid),  lBrowOut = p(LM.leftBrowOuter);
  const rBrowIn  = p(LM.rightBrowInner), rBrowMid = p(LM.rightBrowMid), rBrowOut = p(LM.rightBrowOuter);

  const upLipBot = p(LM.upperLipBot);
  const loLipTop = p(LM.lowerLipTop);

  const hairL = p(LM.hairL), hairM = p(LM.hairM), hairR = p(LM.hairR);

  const eyeC = {
    x: (lEyeOut.x + rEyeOut.x) / 2,
    y: (lEyeOut.y + rEyeOut.y) / 2,
  };
  const faceW = Math.hypot(cheekR.x - cheekL.x, cheekR.y - cheekL.y);
  const faceH = Math.hypot(chin.y - fore.y, chin.x - fore.x);

  let roll = Math.atan2(rEyeOut.y - lEyeOut.y, rEyeOut.x - lEyeOut.x);
  if (roll >  Math.PI / 2) roll -= Math.PI;
  if (roll < -Math.PI / 2) roll += Math.PI;

  const eyeLDist = Math.hypot(lEyeTop.x - lEyeBot.x, lEyeTop.y - lEyeBot.y);
  const eyeRDist = Math.hypot(rEyeTop.x - rEyeBot.x, rEyeTop.y - rEyeBot.y);
  const eyeLWidth = Math.hypot(lEyeIn.x - lEyeOut.x, lEyeIn.y - lEyeOut.y);
  const eyeRWidth = Math.hypot(rEyeIn.x - rEyeOut.x, rEyeIn.y - rEyeOut.y);
  const blinkL = Math.min(1, Math.max(0, 1 - (eyeLDist / (eyeLWidth * 0.55))));
  const blinkR = Math.min(1, Math.max(0, 1 - (eyeRDist / (eyeRWidth * 0.55))));

  const mouthCenterY = (mTop.y + mBot.y) / 2;
  const mouthW = Math.hypot(mRight.x - mLeft.x, mRight.y - mLeft.y);
  const smileL = (mouthCenterY - mLeft.y) / (mouthW * 0.5);
  const smileR = (mouthCenterY - mRight.y) / (mouthW * 0.5);
  const smile = Math.max(-1, Math.min(1, (smileL + smileR) * 0.5 * 2));

  const mouthOpen = Math.hypot(upLipBot.x - loLipTop.x, upLipBot.y - loLipTop.y) / faceH;

  const browRaiseL = (eyeC.y - (lBrowMid.y + lBrowIn.y + lBrowOut.y) / 3) / faceH;
  const browRaiseR = (eyeC.y - (rBrowMid.y + rBrowIn.y + rBrowOut.y) / 3) / faceH;

  const cx = (cheekL.x + cheekR.x) / 2;
  const cy = (eyeC.y + chin.y) / 2;

  return {
    eyeC, faceW, faceH, roll,
    lEyeOut, lEyeIn, rEyeIn, rEyeOut,
    lEyeTop, lEyeBot, rEyeTop, rEyeBot,
    mLeft, mRight, mTop, mBot,
    chin, fore, cheekL, cheekR, nose,
    lBrowIn, lBrowMid, lBrowOut, rBrowIn, rBrowMid, rBrowOut,
    hairL, hairM, hairR,
    browRaiseL, browRaiseR,
    smile, mouthOpen,
    blinkL, blinkR,
    cx, cy,
  };
}

function smoothFace(target) {
  if (!smooth) { smooth = { ...target }; return smooth; }
  const k = CFG.smooth;
  const out = { ...smooth };
  for (const key of ['cx','cy','faceW','faceH','roll','smile','mouthOpen','browRaiseL','browRaiseR']) {
    out[key] = lerp(smooth[key], target[key], k);
  }
  for (const key of ['lEyeOut','lEyeIn','rEyeIn','rEyeOut',
                     'lEyeTop','lEyeBot','rEyeTop','rEyeBot',
                     'mLeft','mRight','mTop','mBot',
                     'chin','fore','cheekL','cheekR','nose',
                     'lBrowIn','lBrowMid','lBrowOut','rBrowIn','rBrowMid','rBrowOut',
                     'hairL','hairM','hairR']) {
    out[key] = {
      x: lerp(smooth[key].x, target[key].x, k),
      y: lerp(smooth[key].y, target[key].y, k),
      z: lerp(smooth[key].z, target[key].z, k),
    };
  }
  out.eyeC = { x: lerp(smooth.eyeC.x, target.eyeC.x, k), y: lerp(smooth.eyeC.y, target.eyeC.y, k) };
  out.blinkL = target.blinkL;
  out.blinkR = target.blinkR;
  smooth = out;
  return out;
}

const HAND_CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],
  [0,17]
];

function computeHand(landmarks, W, H, idx) {
  const pts = landmarks.map(lm => lmToScene(lm, W, H));
  return { pts, idx };
}

function smoothHand(target, idx) {
  if (!handSmooth[idx]) {
    handSmooth[idx] = { pts: target.pts.map(p => ({...p})), idx };
    return handSmooth[idx];
  }
  const k = CFG.smooth;
  const s = handSmooth[idx];
  const out = { idx, pts: [] };
  for (let i = 0; i < target.pts.length; i++) {
    const a = s.pts[i] || target.pts[i];
    const b = target.pts[i];
    out.pts.push({ x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k), z: lerp(a.z, b.z, k) });
  }
  handSmooth[idx] = out;
  return out;
}

// =================== DRAW ===================
function drawAll(F, hands) {
  const W = canvas.width, H = canvas.height;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  if (F) {
    const char = CHARACTERS[currentChar];
    if (currentChar === 'pineapple') drawPineapple(F, char);
    else if (currentChar === 'watermelon') drawWatermelon(F, char);
    else if (currentChar === 'abobus') drawAbobus(F, char);
    else if (currentChar === 'guy') drawGuy(F, char);
    else if (currentChar === 'morty') drawMorty(F, char);
  }
  if (hands && hands.length) hands.forEach(drawPineappleHand);
}

// ===== ОБЩИЕ ЭЛЕМЕНТЫ ЛИЦА =====
function drawBrow(outer, mid, inner, F, raise, side, color) {
  const ox = outer.x - F.cx, oy = outer.y - F.cy;
  const mx = mid.x - F.cx,   my = mid.y - F.cy;
  const ix = inner.x - F.cx, iy = inner.y - F.cy;

  const lift = Math.max(-0.02, Math.min(0.04, (raise - 0.08))) * F.faceH * -1;

  ctx.beginPath();
  ctx.moveTo(ox, oy + lift);
  ctx.quadraticCurveTo(mx, my + lift - F.faceH*0.02, ix, iy + lift);
  ctx.strokeStyle = color;
  ctx.lineWidth = Math.max(4, F.faceW * 0.035);
  ctx.lineCap = 'round';
  ctx.stroke();
}

function drawEye(outer, inner, blink, F) {
  const ecx = (outer.x + inner.x) / 2 - F.cx;
  const ecy = (outer.y + inner.y) / 2 - F.cy;
  const rawW = Math.hypot(inner.x - outer.x, inner.y - outer.y);
  const eyeW = Math.min(rawW * 1.1, F.faceW * 0.22);
  const eyeH = eyeW * 0.7;
  const ang = Math.atan2(inner.y - outer.y, inner.x - outer.x);

  ctx.save();
  ctx.translate(ecx, ecy);
  ctx.rotate(ang);
  const openFactor = 1 - blink * 0.9;

  ctx.beginPath();
  ctx.ellipse(0, 0, eyeW * 0.5, eyeH * 0.5 * openFactor, 0, 0, Math.PI*2);
  ctx.fillStyle = '#FFFFFF';
  ctx.fill();
  ctx.strokeStyle = '#3a2a00';
  ctx.lineWidth = Math.max(1.5, eyeW * 0.07);
  ctx.stroke();

  if (openFactor > 0.15) {
    const noseDX = F.nose.x - F.cx;
    const noseDY = F.nose.y - F.cy;
    const lookX = Math.max(-1, Math.min(1, noseDX / (F.faceW * 0.5))) * eyeW * 0.22;
    const lookY = Math.max(-1, Math.min(1, noseDY / (F.faceH * 0.5))) * eyeH * 0.22;

    const pr = Math.min(eyeW * 0.30, eyeH * 0.45 * openFactor);
    ctx.beginPath();
    ctx.arc(lookX, lookY, pr, 0, Math.PI*2);
    ctx.fillStyle = '#1a1a2e';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(lookX - pr*0.35, lookY - pr*0.35, pr*0.35, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.fill();
  }

  ctx.beginPath();
  ctx.ellipse(0, 0, eyeW * 0.5, eyeH * 0.5 * openFactor, 0, Math.PI + 0.15, -0.15);
  ctx.strokeStyle = '#2a1a00';
  ctx.lineWidth = Math.max(2, eyeW * 0.09);
  ctx.stroke();
  ctx.restore();
}

function drawMouth(F) {
  const mx = (F.mLeft.x + F.mRight.x) / 2 - F.cx;
  const my = (F.mTop.y + F.mBot.y) / 2 - F.cy;
  const mw = Math.hypot(F.mRight.x - F.mLeft.x, F.mRight.y - F.mLeft.y);
  const mh = Math.hypot(F.mBot.x - F.mTop.x, F.mBot.y - F.mTop.y);
  const openRatio = Math.min(1, mh / (mw * 0.5));
  const smile = F.smile;

  const leftCornerX  = F.mLeft.x - F.cx;
  const leftCornerY  = F.mLeft.y - F.cy;
  const rightCornerX = F.mRight.x - F.cx;
  const rightCornerY = F.mRight.y - F.cy;

  if (openRatio > 0.2) {
    ctx.save();
    ctx.translate(mx, my);
    ctx.beginPath();
    ctx.ellipse(0, 0, mw * 0.5, mh * 0.55, 0, 0, Math.PI*2);
    ctx.fillStyle = '#4a0000';
    ctx.fill();
    ctx.strokeStyle = '#2a0000';
    ctx.lineWidth = Math.max(2, mw * 0.04);
    ctx.stroke();

    ctx.beginPath();
    ctx.ellipse(0, mh * 0.25, mw * 0.30, mh * 0.30, 0, 0, Math.PI*2);
    ctx.fillStyle = '#E05050';
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(0, -mh * 0.30, mw * 0.38, mh * 0.12, 0, 0, Math.PI);
    ctx.fillStyle = '#FFF';
    ctx.fill();
    ctx.restore();
  } else {
    const lift = smile * mw * 0.35;
    const cLX = leftCornerX;
    const cLY = leftCornerY - lift;
    const cRX = rightCornerX;
    const cRY = rightCornerY - lift;
    const centerX = (leftCornerX + rightCornerX) / 2;
    const centerY = (leftCornerY + rightCornerY) / 2 - lift * 0.2;

    ctx.beginPath();
    ctx.moveTo(cLX, cLY);
    ctx.quadraticCurveTo(centerX, centerY + mw * 0.18, cRX, cRY);
    ctx.strokeStyle = '#5a2a00';
    ctx.lineWidth = Math.max(4, mw * 0.08);
    ctx.lineCap = 'round';
    ctx.stroke();
  }
}

// ===== ВОЛОСЫ (бывшие листья) =====
function drawHair(F, t, colorArr) {
  const N = 11;
  const baseW = F.faceW * 0.14;

  for (let i = 0; i < N; i++) {
    const tt = i / (N - 1);
    let base;
    if (tt < 0.5) {
      const u = tt / 0.5;
      base = { x: lerp(F.hairL.x, F.hairM.x, u), y: lerp(F.hairL.y, F.hairM.y, u) };
    } else {
      const u = (tt - 0.5) / 0.5;
      base = { x: lerp(F.hairM.x, F.hairR.x, u), y: lerp(F.hairM.y, F.hairR.y, u) };
    }

    const tSway = Math.sin(t * 2 + i * 0.7) * 0.06;
    const spread = (tt - 0.5) * 1.4 + tSway;
    const lenFactor = 0.75 + (1 - Math.abs(tt - 0.5) * 2) * 0.5;
    const len = F.faceH * 0.55 * lenFactor + Math.sin(t * 1.8 + i) * F.faceH * 0.02;

    const endX = base.x + Math.sin(spread) * len * 0.9;
    const endY = base.y - Math.cos(spread) * len;

    const midX = base.x + Math.sin(spread) * len * 0.35;
    const midY = base.y - Math.cos(spread) * len * 0.55;

    const dirX = Math.cos(spread);
    const dirY = Math.sin(spread);
    const perpX = -dirY, perpY = dirX;
    const halfW = baseW * 0.5;

    ctx.beginPath();
    ctx.moveTo(base.x - perpX*halfW*0.9, base.y - perpY*halfW*0.9);
    ctx.quadraticCurveTo(midX - perpX*halfW*1.3, midY - perpY*halfW*1.3, endX, endY);
    ctx.quadraticCurveTo(midX + perpX*halfW*1.3, midY + perpY*halfW*1.3,
                         base.x + perpX*halfW*0.9, base.y + perpY*halfW*0.9);
    ctx.closePath();
    ctx.fillStyle = colorArr[0];
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(base.x - perpX*halfW*0.6, base.y - perpY*halfW*0.6);
    ctx.quadraticCurveTo(midX - perpX*halfW*0.9, midY - perpY*halfW*0.9, endX, endY);
    ctx.quadraticCurveTo(midX + perpX*halfW*0.9, midY + perpY*halfW*0.9,
                         base.x + perpX*halfW*0.6, base.y + perpY*halfW*0.6);
    ctx.closePath();
    const g = ctx.createLinearGradient(base.x, base.y, endX, endY);
    g.addColorStop(0, colorArr[0]);
    g.addColorStop(0.5, colorArr[1]);
    g.addColorStop(1, colorArr[2]);
    ctx.fillStyle = g;
    ctx.fill();
  }
}

// =================== ПЕРСОНАЖИ =======================

// ============ АНАНАС ============
function drawPineapple(F, c) {
  const bodyW = F.faceW * c.bodyW;
  const bodyH = F.faceH * c.bodyH;
  const t = (performance.now() - startTime) / 1000;

  drawHair(F, t, c.leaf);

  ctx.save();
  ctx.translate(F.cx, F.cy);
  ctx.rotate(F.roll);

  // тело
  const grad = ctx.createRadialGradient(-bodyW*0.25, -bodyH*0.30, bodyW*0.05, 0, 0, bodyW*0.62);
  grad.addColorStop(0, c.bodyLight);
  grad.addColorStop(0.45, c.bodyColor);
  grad.addColorStop(0.85, c.bodyDark);
  grad.addColorStop(1, '#7A5C00');

  ctx.beginPath();
  ctx.ellipse(0, 0, bodyW/2, bodyH/2, 0, 0, Math.PI*2);
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = '#8B6914';
  ctx.lineWidth = 3;
  ctx.stroke();

  // узор ромбами
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(0, 0, bodyW/2 - 3, bodyH/2 - 3, 0, 0, Math.PI*2);
  ctx.clip();
  const step = bodyW * 0.13;
  ctx.strokeStyle = 'rgba(139,105,20,0.55)';
  ctx.lineWidth = 1.8;
  for (let i = -12; i <= 12; i++) {
    for (let j = -12; j <= 12; j++) {
      const px = i * step, py = j * step * 0.85;
      const offset = (j % 2) * step * 0.5;
      ctx.beginPath();
      ctx.moveTo(px + offset, py - step*0.35);
      ctx.lineTo(px + offset + step*0.35, py);
      ctx.lineTo(px + offset, py + step*0.35);
      ctx.lineTo(px + offset - step*0.35, py);
      ctx.closePath();
      ctx.stroke();
    }
  }
  ctx.restore();

  drawBrow(F.lBrowOut, F.lBrowMid, F.lBrowIn, F, F.browRaiseL, -1, c.browColor);
  drawBrow(F.rBrowIn, F.rBrowMid, F.rBrowOut, F, F.browRaiseR, 1, c.browColor);
  drawEye(F.lEyeOut, F.lEyeIn, F.blinkL, F);
  drawEye(F.rEyeIn, F.rEyeOut, F.blinkR, F);
  drawMouth(F);
  ctx.restore();
}

// ============ АРБУЗ ============
function drawWatermelon(F, c) {
  const bodyW = F.faceW * c.bodyW;
  const bodyH = F.faceH * c.bodyH;
  const t = (performance.now() - startTime) / 1000;

  // хвостик-усик вместо волос
  ctx.save();
  const hs = F.hairM;
  ctx.beginPath();
  ctx.moveTo(hs.x, hs.y);
  ctx.quadraticCurveTo(hs.x + 30 + Math.sin(t*2)*5, hs.y - 40, hs.x + 10 + Math.sin(t*2)*8, hs.y - 70);
  ctx.strokeStyle = '#5D4037';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.stroke();
  // листик на хвостике
  ctx.beginPath();
  ctx.ellipse(hs.x + 12, hs.y - 65, 12, 6, -0.5 + Math.sin(t*2)*0.1, 0, Math.PI*2);
  ctx.fillStyle = '#2E8B2E';
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(F.cx, F.cy);
  ctx.rotate(F.roll);

  // тело арбуза (тёмно-зелёный)
  const grad = ctx.createRadialGradient(-bodyW*0.25, -bodyH*0.30, bodyW*0.05, 0, 0, bodyW*0.62);
  grad.addColorStop(0, c.bodyLight);
  grad.addColorStop(0.45, c.bodyColor);
  grad.addColorStop(0.85, c.bodyDark);
  grad.addColorStop(1, '#0D3B0D');

  ctx.beginPath();
  ctx.ellipse(0, 0, bodyW/2, bodyH/2, 0, 0, Math.PI*2);
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = '#0D3B0D';
  ctx.lineWidth = 3;
  ctx.stroke();

  // полоски арбуза
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(0, 0, bodyW/2 - 2, bodyH/2 - 2, 0, 0, Math.PI*2);
  ctx.clip();
  ctx.strokeStyle = 'rgba(20,60,20,0.85)';
  ctx.lineWidth = bodyW * 0.05;
  for (let i = -4; i <= 4; i++) {
    const x = i * bodyW * 0.14;
    ctx.beginPath();
    ctx.moveTo(x, -bodyH/2);
    ctx.quadraticCurveTo(x + bodyW*0.08, 0, x, bodyH/2);
    ctx.stroke();
  }
  ctx.restore();

  drawBrow(F.lBrowOut, F.lBrowMid, F.lBrowIn, F, F.browRaiseL, -1, c.browColor);
  drawBrow(F.rBrowIn, F.rBrowMid, F.rBrowOut, F, F.browRaiseR, 1, c.browColor);
  drawEye(F.lEyeOut, F.lEyeIn, F.blinkL, F);
  drawEye(F.rEyeIn, F.rEyeOut, F.blinkR, F);
  drawMouth(F);
  ctx.restore();
}

// ============ АБОБУС ============
function drawAbobus(F, c) {
  const bodyW = F.faceW * c.bodyW;
  const bodyH = F.faceH * c.bodyH;
  const t = (performance.now() - startTime) / 1000;

  // антенны
  ctx.save();
  const antX = F.cx, antY = F.cy - bodyH * 0.5;
  for (const side of [-1, 1]) {
    const endX = antX + side * bodyW * 0.25 + Math.sin(t*2 + side)*5;
    const endY = antY - bodyH * 0.45;
    ctx.beginPath();
    ctx.moveTo(antX + side * bodyW * 0.15, antY);
    ctx.quadraticCurveTo(antX + side * bodyW * 0.3, antY - bodyH*0.2, endX, endY);
    ctx.strokeStyle = '#37474F';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.stroke();
    // шарик
    ctx.beginPath();
    ctx.arc(endX, endY, 8, 0, Math.PI*2);
    ctx.fillStyle = '#FF5252';
    ctx.fill();
    ctx.strokeStyle = '#37474F';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  ctx.restore();

  ctx.save();
  ctx.translate(F.cx, F.cy);
  ctx.rotate(F.roll);

  // тело — округлый прямоугольник с скруглёнными углами (типа автобус)
  const r = Math.min(bodyW, bodyH) * 0.25;
  const w = bodyW, h = bodyH;
  const x = -w/2, y = -h/2;

  const grad = ctx.createLinearGradient(x, y, x, y + h);
  grad.addColorStop(0, c.bodyLight);
  grad.addColorStop(0.5, c.bodyColor);
  grad.addColorStop(1, c.bodyDark);

  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = '#546E7A';
  ctx.lineWidth = 3;
  ctx.stroke();

  // окна-фары сверху
  ctx.fillStyle = 'rgba(66,165,245,0.85)';
  ctx.beginPath();
  ctx.roundRect(-bodyW*0.35, -bodyH*0.45, bodyW*0.3, bodyH*0.12, 6);
  ctx.fill();
  ctx.beginPath();
  ctx.roundRect(bodyW*0.05, -bodyH*0.45, bodyW*0.3, bodyH*0.12, 6);
  ctx.fill();

  // полоска
  ctx.fillStyle = '#1565C0';
  ctx.fillRect(-bodyW/2 + 5, bodyH*0.25, bodyW - 10, bodyH*0.08);

  drawBrow(F.lBrowOut, F.lBrowMid, F.lBrowIn, F, F.browRaiseL, -1, c.browColor);
  drawBrow(F.rBrowIn, F.rBrowMid, F.rBrowOut, F, F.browRaiseR, 1, c.browColor);
  drawEye(F.lEyeOut, F.lEyeIn, F.blinkL, F);
  drawEye(F.rEyeIn, F.rEyeOut, F.blinkR, F);
  drawMouth(F);
  ctx.restore();
}

// ============ МУЖИК ============
function drawGuy(F, c) {
  const bodyW = F.faceW * c.bodyW;
  const bodyH = F.faceH * c.bodyH;
  const t = (performance.now() - startTime) / 1000;

  ctx.save();
  ctx.translate(F.cx, F.cy);
  ctx.rotate(F.roll);

  // голова
  const grad = ctx.createRadialGradient(-bodyW*0.25, -bodyH*0.30, bodyW*0.05, 0, 0, bodyW*0.62);
  grad.addColorStop(0, c.bodyLight);
  grad.addColorStop(0.45, c.bodyColor);
  grad.addColorStop(0.85, c.bodyDark);
  grad.addColorStop(1, '#A0764A');

  ctx.beginPath();
  ctx.ellipse(0, 0, bodyW/2, bodyH/2, 0, 0, Math.PI*2);
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = '#8B6B4A';
  ctx.lineWidth = 3;
  ctx.stroke();

  // волосы сверху — шапка
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(0, -bodyH*0.4, bodyW*0.5, bodyH*0.35, 0, Math.PI, Math.PI*2);
  ctx.fillStyle = '#3E2723';
  ctx.fill();
  ctx.restore();

  // нос
  const nx = F.nose.x - F.cx, ny = F.nose.y - F.cy;
  ctx.beginPath();
  ctx.ellipse(nx, ny, bodyW*0.07, bodyH*0.06, 0, 0, Math.PI*2);
  ctx.fillStyle = '#D4A373';
  ctx.fill();
  ctx.strokeStyle = '#A0764A';
  ctx.lineWidth = 2;
  ctx.stroke();

  // борода
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(0, bodyH*0.32, bodyW*0.38, bodyH*0.28, 0, 0, Math.PI*2);
  ctx.fillStyle = '#3E2723';
  ctx.fill();
  ctx.restore();

  drawBrow(F.lBrowOut, F.lBrowMid, F.lBrowIn, F, F.browRaiseL, -1, c.browColor);
  drawBrow(F.rBrowIn, F.rBrowMid, F.rBrowOut, F, F.browRaiseR, 1, c.browColor);
  drawEye(F.lEyeOut, F.lEyeIn, F.blinkL, F);
  drawEye(F.rEyeIn, F.rEyeOut, F.blinkR, F);
  drawMouth(F);
  ctx.restore();
}

// ============ ЗЛОЙ МОРТИ ============
function drawMorty(F, c) {
  const bodyW = F.faceW * c.bodyW;
  const bodyH = F.faceH * c.bodyH;
  const t = (performance.now() - startTime) / 1000;

  // волосы-вихор
  ctx.save();
  const hs = F.hairM;
  ctx.beginPath();
  ctx.moveTo(hs.x, hs.y + 10);
  ctx.quadraticCurveTo(hs.x - 20 + Math.sin(t*2)*4, hs.y - 25, hs.x + 15, hs.y - 40);
  ctx.quadraticCurveTo(hs.x + 30, hs.y - 20, hs.x + 5, hs.y + 5);
  ctx.fillStyle = '#C6A700';
  ctx.fill();
  ctx.strokeStyle = '#8B7500';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.translate(F.cx, F.cy);
  ctx.rotate(F.roll);

  // голова
  const grad = ctx.createRadialGradient(-bodyW*0.25, -bodyH*0.30, bodyW*0.05, 0, 0, bodyW*0.62);
  grad.addColorStop(0, c.bodyLight);
  grad.addColorStop(0.45, c.bodyColor);
  grad.addColorStop(0.85, c.bodyDark);
  grad.addColorStop(1, '#A08000');

  ctx.beginPath();
  ctx.ellipse(0, 0, bodyW/2, bodyH/2, 0, 0, Math.PI*2);
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = '#C9A227';
  ctx.lineWidth = 3;
  ctx.stroke();

  // злые брови (перевёрнутые — угол вниз к центру)
  const drawAngryBrow = (side) => {
    const outer = side < 0 ? F.lBrowOut : F.rBrowOut;
    const inner = side < 0 ? F.lBrowIn : F.rBrowIn;
    const ox = outer.x - F.cx, oy = outer.y - F.cy;
    const ix = inner.x - F.cx, iy = inner.y - F.cy;
    // внутренний конец опускаем
    ctx.beginPath();
    ctx.moveTo(ox, oy - F.faceH*0.02);
    ctx.lineTo(ix, iy + F.faceH*0.04);
    ctx.strokeStyle = c.browColor;
    ctx.lineWidth = Math.max(5, F.faceW * 0.045);
    ctx.lineCap = 'round';
    ctx.stroke();
  };
  drawAngryBrow(-1);
  drawAngryBrow(1);

  drawEye(F.lEyeOut, F.lEyeIn, F.blinkL, F);
  drawEye(F.rEyeIn, F.rEyeOut, F.blinkR, F);

  // злой рот (перевёрнутая дуга)
  const mx = (F.mLeft.x + F.mRight.x) / 2 - F.cx;
  const my = (F.mTop.y + F.mBot.y) / 2 - F.cy;
  const mw = Math.hypot(F.mRight.x - F.mLeft.x, F.mRight.y - F.mLeft.y);
  if (F.mouthOpen > 0.02) {
    // открытый злой рот — просто тёмный овал
    ctx.beginPath();
    ctx.ellipse(mx, my, mw * 0.45, mw * 0.35, 0, 0, Math.PI*2);
    ctx.fillStyle = '#2a0000';
    ctx.fill();
    ctx.strokeStyle = '#4a0000';
    ctx.lineWidth = 2;
    ctx.stroke();
  } else {
    // злая линия
    ctx.beginPath();
    ctx.moveTo(mx - mw*0.4, my + mw*0.1);
    ctx.quadraticCurveTo(mx, my - mw*0.15, mx + mw*0.4, my + mw*0.1);
    ctx.strokeStyle = '#5a2a00';
    ctx.lineWidth = Math.max(4, mw * 0.08);
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  ctx.restore();
}

// ===== РУКИ =====
function drawPineappleHand(hand) {
  const pts = hand.pts;

  ctx.save();
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  ctx.lineWidth = 20;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.filter = 'blur(8px)';
  for (const [a, b] of HAND_CONNECTIONS) {
    ctx.beginPath();
    ctx.moveTo(pts[a].x + 6, pts[a].y + 6);
    ctx.lineTo(pts[b].x + 6, pts[b].y + 6);
    ctx.stroke();
  }
  ctx.filter = 'none';
  ctx.restore();

  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  for (const [a, b] of HAND_CONNECTIONS) {
    const p1 = pts[a], p2 = pts[b];
    let width = 16;
    if (a === 0 && b >= 1 && b <= 5) width = 22;
    else if (a >= 5 && a <= 9) width = 18;
    else if (a >= 9 && a <= 13) width = 16;
    else if (a >= 13) width = 13;
    if (b === 4 || b === 8 || b === 12 || b === 16 || b === 20) width *= 0.85;

    const g = ctx.createLinearGradient(p1.x, p1.y, p2.x, p2.y);
    g.addColorStop(0, '#F5C542');
    g.addColorStop(1, '#FFE97A');

    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.strokeStyle = '#8B6914';
    ctx.lineWidth = width + 3;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.strokeStyle = g;
    ctx.lineWidth = width;
    ctx.stroke();
  }

  const joints = new Set();
  for (const [a, b] of HAND_CONNECTIONS) { joints.add(a); joints.add(b); }
  for (const i of joints) {
    const p = pts[i];
    let w = 8;
    for (const [a, b] of HAND_CONNECTIONS) {
      if (a === i || b === i) {
        let width = 16;
        if (a === 0 && b >= 1 && b <= 5) width = 22;
        else if (a >= 5 && a <= 9) width = 18;
        else if (a >= 9 && a <= 13) width = 16;
        else if (a >= 13) width = 13;
        w = Math.max(w, width);
      }
    }
    ctx.beginPath();
    ctx.arc(p.x, p.y, w/2, 0, Math.PI*2);
    ctx.fillStyle = '#F5C542';
    ctx.fill();
    ctx.strokeStyle = '#8B6914';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  ctx.restore();
}

// =================== LOOP ===================
function loop() {
  const now = performance.now() / 1000;
  if (video.currentTime !== lastVideoTime && faceLandmarker && handLandmarker) {
    lastVideoTime = video.currentTime;

    const faceRes = faceLandmarker.detectForVideo(video, now * 1000);
    const handRes = handLandmarker.detectForVideo(video, now * 1000);

    let F = null;
    if (faceRes.faceLandmarks && faceRes.faceLandmarks.length > 0) {
      const target = computeFace(faceRes.faceLandmarks[0], canvas.width, canvas.height);
      F = smoothFace(target);
    } else {
      smooth = null;
    }

    const hands = [];
    if (handRes.landmarks && handRes.landmarks.length > 0) {
      handRes.landmarks.forEach((lm, idx) => {
        const target = computeHand(lm, canvas.width, canvas.height, idx);
        hands.push(smoothHand(target, idx));
      });
      for (const key in handSmooth) {
        if (Number(key) >= handRes.landmarks.length) delete handSmooth[key];
      }
    } else {
      handSmooth = {};
    }

    drawAll(F, hands);
  }
  requestAnimationFrame(loop);
}

init().catch(err => {
  console.error(err);
});
